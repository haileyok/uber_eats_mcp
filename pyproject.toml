[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uber-eats-mcp"
version = "0.2.0"
description = "MCP server for ordering food on Uber Eats (CDP-based persistent browser session fork)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.26.0",
    "playwright>=1.58.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
uber-eats-mcp = "uber_eats_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
